<!-- @dsCard group="Colors" viewport="700x150" subtitle="The only true accent — steady, calm, affirmative" name="Sage" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div class="row" style="grid-template-columns: repeat(7, 1fr)">
<div class="sw"><div class="chip" style="background: var(--sage-900)"></div><div class="nm">900</div><div class="hx">#2F3A31</div></div><div class="sw"><div class="chip" style="background: var(--sage-700)"></div><div class="nm">700</div><div class="hx">#4A5B4E</div></div><div class="sw"><div class="chip" style="background: var(--sage-600)"></div><div class="nm">600 · accent</div><div class="hx">#5F7A63</div></div><div class="sw"><div class="chip" style="background: var(--sage-400)"></div><div class="nm">400</div><div class="hx">#7C9280</div></div><div class="sw"><div class="chip" style="background: var(--sage-200)"></div><div class="nm">200</div><div class="hx">#C7D5C3</div></div><div class="sw"><div class="chip" style="background: var(--sage-100)"></div><div class="nm">100 · tint</div><div class="hx">#E7EDE5</div></div><div class="sw"><div class="chip" style="background: var(--sage-050)"></div><div class="nm">050</div><div class="hx">#F2F5F1</div></div>
</div>
</div></body>
</html>
