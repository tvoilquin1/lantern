<!-- @dsCard group="Brand" viewport="700x165" subtitle="Near-iconless by design — dots, rules and typographic marks" name="Iconography" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div style="display:flex;gap:24px;align-items:center">
  <div style="display:flex;gap:7px;align-items:center;font-size:13px;font-weight:600;color:var(--text-faint)"><div style="width:6px;height:6px;border-radius:999px;background:var(--sage-600)"></div>Lantern</div>
  <div style="width:18px;height:18px;border-radius:6px;border:1.5px solid var(--sage-600)"></div>
  <div style="font-size:12px;font-weight:600;color:var(--sage-600)">01</div>
  <div style="width:40px;height:40px;border-radius:999px;background:var(--sage-600);color:var(--paper-card);display:flex;align-items:center;justify-content:center;font-size:17px">↑</div>
  <div style="font-size:18px;color:var(--text-faint)">←</div>
  <div style="font-size:14px;color:var(--text-faint)">›</div>
</div>
<div class="hx" style="margin-top:12px">No icon font, no emoji. The 6px sage dot is the only mark. Unicode arrows carry send / back / drill-in.</div>
</div></body>
</html>
