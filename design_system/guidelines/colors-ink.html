<!-- @dsCard group="Colors" viewport="700x150" subtitle="Four warm-black text tiers, all AA on paper" name="Ink" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div class="row" style="grid-template-columns: repeat(4, 1fr)">
<div class="sw"><div class="chip" style="background: var(--ink-900)"></div><div class="nm">ink-900 · primary</div><div class="hx">#2A2724</div></div><div class="sw"><div class="chip" style="background: var(--ink-700)"></div><div class="nm">ink-700 · secondary</div><div class="hx">#3D3934</div></div><div class="sw"><div class="chip" style="background: var(--ink-500)"></div><div class="nm">ink-500 · body</div><div class="hx">#6E675E</div></div><div class="sw"><div class="chip" style="background: var(--ink-400)"></div><div class="nm">ink-400 · faint</div><div class="hx">#8A8378</div></div>
</div>
</div></body>
</html>
