<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div style="display:flex;gap:8px;align-items:flex-end">
  <div class="sw"><div style="width:3px;height:6px;background:var(--sage-200);border-radius:3px"></div><div class="hx">3</div></div><div class="sw"><div style="width:5px;height:10px;background:var(--sage-200);border-radius:3px"></div><div class="hx">5</div></div><div class="sw"><div style="width:6px;height:12px;background:var(--sage-200);border-radius:3px"></div><div class="hx">6</div></div><div class="sw"><div style="width:8px;height:16px;background:var(--sage-200);border-radius:3px"></div><div class="hx">8</div></div><div class="sw"><div style="width:10px;height:20px;background:var(--sage-200);border-radius:3px"></div><div class="hx">10</div></div><div class="sw"><div style="width:11px;height:22px;background:var(--sage-200);border-radius:3px"></div><div class="hx">11</div></div><div class="sw"><div style="width:12px;height:24px;background:var(--sage-200);border-radius:3px"></div><div class="hx">12</div></div><div class="sw"><div style="width:14px;height:28px;background:var(--sage-200);border-radius:3px"></div><div class="hx">14</div></div><div class="sw"><div style="width:16px;height:32px;background:var(--sage-200);border-radius:3px"></div><div class="hx">16</div></div><div class="sw"><div style="width:18px;height:36px;background:var(--sage-200);border-radius:3px"></div><div class="hx">18</div></div><div class="sw"><div style="width:20px;height:40px;background:var(--sage-200);border-radius:3px"></div><div class="hx">20</div></div><div class="sw"><div style="width:22px;height:44px;background:var(--sage-200);border-radius:3px"></div><div class="hx">22</div></div><div class="sw"><div style="width:26px;height:52px;background:var(--sage-200);border-radius:3px"></div><div class="hx">26</div></div>
</div>
<div class="hx" style="margin-top:12px">Card padding 17 / 20 · card gap 11 · stack gap 9 · screen gutter 20-26.</div>
</div></body>
</html>
