<!-- @dsCard group="Colors" viewport="700x150" subtitle="The warm neutral ground — Lantern never uses pure white or grey" name="Paper" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-desk); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div class="row" style="grid-template-columns: repeat(6, 1fr)">
<div class="sw"><div class="chip" style="background: var(--paper-desk)"></div><div class="nm">desk</div><div class="hx">#E8E4DC</div></div><div class="sw"><div class="chip" style="background: var(--paper-app)"></div><div class="nm">app</div><div class="hx">#F6F2EA</div></div><div class="sw"><div class="chip" style="background: var(--paper-card)"></div><div class="nm">card</div><div class="hx">#FFFDFA</div></div><div class="sw"><div class="chip" style="background: var(--paper-inset)"></div><div class="nm">inset</div><div class="hx">#FAF7F1</div></div><div class="sw"><div class="chip" style="background: var(--paper-muted)"></div><div class="nm">muted</div><div class="hx">#EFEAE1</div></div><div class="sw"><div class="chip" style="background: var(--paper-hairline)"></div><div class="nm">hairline</div><div class="hx">#F0EBE2</div></div>
</div>
</div></body>
</html>
