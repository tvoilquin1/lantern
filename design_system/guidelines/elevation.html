<!-- @dsCard group="Spacing" viewport="700x175" subtitle="Edge, not lift — real shadow only where something floats" name="Elevation" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div style="display:flex;gap:12px">
  <div class="sw" style="flex:1"><div style="height:70px;background:var(--paper-card);border-radius:20px;box-shadow:var(--shadow-hairline)"></div><div class="nm">hairline</div></div><div class="sw" style="flex:1"><div style="height:70px;background:var(--paper-card);border-radius:20px;box-shadow:var(--shadow-card)"></div><div class="nm">card</div></div><div class="sw" style="flex:1"><div style="height:70px;background:var(--paper-card);border-radius:20px;box-shadow:var(--shadow-raised)"></div><div class="nm">raised</div></div>
</div>
<div class="hx" style="margin-top:10px">Only the composer and the device frame carry a true drop shadow.</div>
</div></body>
</html>
