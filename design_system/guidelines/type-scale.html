<!-- @dsCard group="Type" viewport="700x150" subtitle="One family. Hierarchy from weight and tracking, never a second face" name="Weight ladder" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div style="display:flex;gap:22px;align-items:baseline">
  <div style="font-weight:400;font-size:19px;color:var(--text-primary)">Regular 400</div>
  <div style="font-weight:500;font-size:19px;color:var(--text-primary)">Medium 500</div>
  <div style="font-weight:600;font-size:19px;color:var(--text-primary)">Semibold 600</div>
  <div style="font-weight:700;font-size:19px;letter-spacing:-0.015em;color:var(--text-primary)">Bold 700</div>
</div>
<div class="hx" style="margin-top:10px">Plus Jakarta Sans — substituted from Google Fonts; no brand webfont was supplied.</div>
</div></body>
</html>
