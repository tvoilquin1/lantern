<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper-app); }
  .wrap { padding: 18px 20px; box-sizing: border-box; }
  .sw { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 46px; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(42,39,36,0.06); }
  .nm { font-size: 11.5px; font-weight: 600; color: var(--text-primary); }
  .hx { font-size: 10.5px; color: var(--text-body); letter-spacing: 0.02em; }
  .row { display: grid; gap: 10px; }
</style>
</head>
<body><div class="wrap">

<div style="display:flex;flex-direction:column;gap:12px">
  <div><div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-body)">Where you are</div><div class="hx">eyebrow · 11 / 600 / 0.12em</div></div>
  <div><div style="font-size:10.5px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-body)">Tuesday, 26 August</div><div class="hx">eyebrow sm · 10.5 / 600 / 0.14em</div></div>
  <div><div style="font-size:12px;font-weight:500;color:var(--text-primary)">Sleep · 2 wakings</div><div class="hx">chip · 12 / 500</div></div>
</div>
</div></body>
</html>
