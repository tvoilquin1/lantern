<!-- @dsCard group="Components" viewport="700x360" name="Conversation" subtitle="Bubbles, extracted log chips, suggestions, composer" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Conversation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--paper-desk); font-family: var(--font-sans); }
  #root { padding: 18px 20px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var e = React.createElement;
  var L = window.Lantern;

  var MessageBubble = L.MessageBubble, InsetPanel = L.InsetPanel, LogChip = L.LogChip;
  var ChipRow = L.ChipRow, SuggestionChip = L.SuggestionChip, Composer = L.Composer;
  ReactDOM.createRoot(document.getElementById("root")).render(
    e("div", { style: { display: "flex", flexDirection: "column", gap: 10, background: "var(--surface-app)", padding: 16, borderRadius: "var(--radius-card)" } },
      e(MessageBubble, { from: "companion" }, "How was last night for the two of you?"),
      e(MessageBubble, { from: "caregiver" }, "He was up at 2 and again at 4. I got maybe four hours."),
      e(MessageBubble, { from: "companion" },
        e("div", null, "Four hours is not enough, and this is the fourth night this week. I've noted it."),
        e(InsetPanel, { label: "Added to Dad's log" },
          e(ChipRow, { gap: "6px" },
            e(LogChip, null, "Sleep \u00B7 2 wakings"),
            e(LogChip, null, "Night wandering"),
            e(LogChip, { tone: "caution" }, "Your sleep \u00B7 4h")))),
      e(ChipRow, null,
        e(SuggestionChip, null, "Looking for something"),
        e(SuggestionChip, null, "Just pacing"),
        e(SuggestionChip, null, "Not sure")),
      e(Composer, { placeholder: "Type as much or as little as you like" })));
})();
</script>
</body>
</html>
