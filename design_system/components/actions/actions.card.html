<!-- @dsCard group="Components" viewport="700x330" name="Actions & header" subtitle="Buttons, task items, guidance list, screen header" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Actions</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--paper-desk); font-family: var(--font-sans); }
  #root { padding: 18px 20px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var e = React.createElement;
  var L = window.Lantern;

  var Button = L.Button, TaskItem = L.TaskItem, GuidanceList = L.GuidanceList;
  var AppHeader = L.AppHeader, Card = L.Card, SectionLabel = L.SectionLabel, StatePill = L.StatePill;
  ReactDOM.createRoot(document.getElementById("root")).render(
    e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, alignItems: "start" } },
      e("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
        e(Card, { variant: "paper", style: { background: "var(--surface-app)", boxShadow: "none" } },
          e(AppHeader, { eyebrow: "Tuesday, 26 August", title: "Good morning, Sarah.",
            action: e(StatePill, { tone: "neutral" }, "Today \u203A") })),
        e(Card, { variant: "dark" },
          e(SectionLabel, { onDark: true }, "In front of you"),
          e(TaskItem, { onDark: true }, "Two hours of respite care this week \u2014 I found three options near you."),
          e(TaskItem, { onDark: true, done: true }, "Move Dad's bedtime routine 30 minutes earlier."))),
      e("div", { style: { display: "flex", flexDirection: "column", gap: 12 } },
        e(Card, { variant: "panel" },
          e(SectionLabel, { size: "sm" }, "What tends to help now"),
          e(GuidanceList, { items: [
            "Lay out clothes in the order they go on.",
            "A night light in the hallway and a bed sensor.",
            "Answer the feeling, not the fact."
          ] })),
        e("div", { style: { display: "flex", flexDirection: "column", gap: 8 } },
          e(Button, null, "Talk this through with Lantern"),
          e(Button, { variant: "secondary" }, "Bring this to his appointment"),
          e(Button, { variant: "quiet" }, "Not now")))));
})();
</script>
</body>
</html>
